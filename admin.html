<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Dandi CCI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .card-box { background: #f9f9f9; border-radius: 10px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .admin-form input, .admin-form textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; }
    .item-list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
    .item-list-row img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    .btn-danger { background: #d9534f; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; }
    .hidden { display: none !important; }
    .status-msg { margin-top: 10px; font-weight: bold; color: #0b5d3b; }
  </style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo"><span>DANDI CCI ADMIN</span></a>
  <button id="logoutBtn" class="btn hidden" style="background:#d9534f">Logout</button>
</header>

<div class="admin-container">
  
  <!-- LOGIN SECTION -->
  <div id="loginBox" class="card-box" style="max-width:400px; margin: 50px auto;">
    <h2>Admin Login</h2>
    <form id="loginForm" class="admin-form">
      <input type="email" id="adminEmail" placeholder="Email" required>
      <input type="password" id="adminPass" placeholder="Password" required>
      <button type="submit" class="btn" style="width:100%;">Sign In</button>
      <p id="loginError" style="color:red; margin-top:10px;" class="hidden"></p>
    </form>
  </div>

  <!-- DASHBOARD PANEL -->
  <div id="dashboardPanel" class="hidden">
    
    <!-- ADD / EDIT ACTIVITY GALLERY ITEM -->
    <div class="card-box">
      <h3 id="actFormTitle">Add New Activity / Photo</h3>
      <form id="activityForm" class="admin-form">
        <input type="hidden" id="actDocId">
        <input type="hidden" id="actExistingUrl">
        
        <label>Activity Title:</label>
        <input type="text" id="actTitle" placeholder="e.g. Sallah Outreach" required>
        
        <label>Select Image File from Device:</label>
        <input type="file" id="actFileInput" accept="image/*">
        
        <button type="submit" class="btn" id="actSubmitBtn">Save Activity</button>
        <button type="button" class="btn hidden" id="actCancelBtn" style="background:#888;">Cancel Edit</button>
        <div id="actStatus" class="status-msg"></div>
      </form>
    </div>

    <!-- LIST OF ACTIVITIES -->
    <div class="card-box">
      <h3>Manage Gallery Activities</h3>
      <div id="activitiesList">Loading activities...</div>
    </div>

    <!-- ADD / EDIT TEAM MEMBERS -->
    <div class="card-box">
      <h3 id="teamFormTitle">Add Leadership Team Member</h3>
      <form id="teamForm" class="admin-form">
        <input type="hidden" id="teamDocId">
        <input type="hidden" id="teamExistingUrl">
        
        <label>Full Name:</label>
        <input type="text" id="teamName" placeholder="e.g. Amb. Abbas Ibn Saad" required>
        
        <label>Role:</label>
        <input type="text" id="teamRole" placeholder="e.g. Founder" required>
        
        <label>Select Profile Photo:</label>
        <input type="file" id="teamFileInput" accept="image/*">
        
        <button type="submit" class="btn" id="teamSubmitBtn">Save Member</button>
        <button type="button" class="btn hidden" id="teamCancelBtn" style="background:#888;">Cancel Edit</button>
        <div id="teamStatus" class="status-msg"></div>
      </form>
    </div>

    <!-- LIST OF TEAM MEMBERS -->
    <div class="card-box">
      <h3>Manage Team Members</h3>
      <div id="teamList">Loading members...</div>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBowHTWBRUJlYJESKNzCUKwHbIFcBiu-Xc",
    authDomain: "dandi-cci.firebaseapp.com",
    projectId: "dandi-cci",
    storageBucket: "dandi-cci.firebasestorage.app",
    messagingSenderId: "725172631759",
    appId: "1:725172631759:web:42d584c0650f8e0d545fba"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  // Helper function to handle image uploads to Firebase Storage
  async function uploadFile(fileInput, folder) {
    const file = fileInput.files[0];
    if (!file) return null;
    const storageRef = ref(storage, `${folder}/${Date.now()}_${file.name}`);
    const snapshot = await uploadBytes(storageRef, file);
    return await getDownloadURL(snapshot.ref);
  }

  // Auth Observer
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashboardPanel').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      loadActivities();
      loadTeam();
    } else {
      document.getElementById('loginBox').classList.remove('hidden');
      document.getElementById('dashboardPanel').classList.add('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
    }
  });

  // Login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value;
    const pass = document.getElementById('adminPass').value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      const errTxt = document.getElementById('loginError');
      errTxt.innerText = "Invalid credentials: " + err.message;
      errTxt.classList.remove('hidden');
    }
  });

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

  // --- ACTIVITIES ---
  const activityForm = document.getElementById('activityForm');
  activityForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('actStatus');
    const id = document.getElementById('actDocId').value;
    const title = document.getElementById('actTitle').value;
    const existingUrl = document.getElementById('actExistingUrl').value;
    const fileInput = document.getElementById('actFileInput');

    try {
      status.innerText = "Uploading & saving...";
      let imageUrl = existingUrl;

      // Upload new file if selected
      if (fileInput.files.length > 0) {
        imageUrl = await uploadFile(fileInput, 'activities');
      }

      if (!imageUrl) {
        alert("Please select an image file.");
        status.innerText = "";
        return;
      }

      if (id) {
        await updateDoc(doc(db, "activities", id), { title, imageUrl });
      } else {
        await addDoc(collection(db, "activities"), { title, imageUrl, date: new Date().toISOString() });
      }

      status.innerText = "Saved successfully!";
      setTimeout(() => { status.innerText = ""; }, 3000);
      resetActForm();
      loadActivities();
    } catch (err) {
      alert("Error saving activity: " + err.message);
      status.innerText = "";
    }
  });

  async function loadActivities() {
    const list = document.getElementById('activitiesList');
    try {
      const q = query(collection(db, "activities"), orderBy("date", "desc"));
      const snap = await getDocs(q);
      list.innerHTML = "";
      
      if (snap.empty) {
        list.innerHTML = "<p>No activities added yet.</p>";
        return;
      }

      snap.forEach((d) => {
        const data = d.data();
        const div = document.createElement('div');
        div.className = 'item-list-row';
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${data.imageUrl}">
            <span><strong>${data.title}</strong></span>
          </div>
          <div>
            <button class="btn edit-act-btn" style="padding:6px 12px; margin-right:5px;">Edit</button>
            <button class="btn-danger del-act-btn">Delete</button>
          </div>
        `;

        div.querySelector('.edit-act-btn').onclick = () => {
          document.getElementById('actDocId').value = d.id;
          document.getElementById('actTitle').value = data.title;
          document.getElementById('actExistingUrl').value = data.imageUrl;
          document.getElementById('actFormTitle').innerText = "Edit Activity";
          document.getElementById('actSubmitBtn').innerText = "Update Activity";
          document.getElementById('actCancelBtn').classList.remove('hidden');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        div.querySelector('.del-act-btn').onclick = async () => {
          if (confirm("Delete this activity?")) {
            await deleteDoc(doc(db, "activities", d.id));
            loadActivities();
          }
        };

        list.appendChild(div);
      });
    } catch (err) {
      list.innerHTML = "<p>Error: " + err.message + "</p>";
    }
  }

  function resetActForm() {
    document.getElementById('actDocId').value = "";
    document.getElementById('actExistingUrl').value = "";
    activityForm.reset();
    document.getElementById('actFormTitle').innerText = "Add New Activity / Photo";
    document.getElementById('actSubmitBtn').innerText = "Save Activity";
    document.getElementById('actCancelBtn').classList.add('hidden');
  }
  document.getElementById('actCancelBtn').onclick = resetActForm;

  // --- TEAM MEMBERS ---
  const teamForm = document.getElementById('teamForm');
  teamForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('teamStatus');
    const id = document.getElementById('teamDocId').value;
    const name = document.getElementById('teamName').value;
    const role = document.getElementById('teamRole').value;
    const existingUrl = document.getElementById('teamExistingUrl').value;
    const fileInput = document.getElementById('teamFileInput');

    try {
      status.innerText = "Uploading & saving...";
      let imageUrl = existingUrl;

      if (fileInput.files.length > 0) {
        imageUrl = await uploadFile(fileInput, 'team');
      }

      if (!imageUrl) {
        alert("Please select a profile photo.");
        status.innerText = "";
        return;
      }

      if (id) {
        await updateDoc(doc(db, "team", id), { name, role, imageUrl });
      } else {
        await addDoc(collection(db, "team"), { name, role, imageUrl });
      }

      status.innerText = "Saved successfully!";
      setTimeout(() => { status.innerText = ""; }, 3000);
      resetTeamForm();
      loadTeam();
    } catch (err) {
      alert("Error saving member: " + err.message);
      status.innerText = "";
    }
  });

  async function loadTeam() {
    const list = document.getElementById('teamList');
    try {
      const snap = await getDocs(collection(db, "team"));
      list.innerHTML = "";

      if (snap.empty) {
        list.innerHTML = "<p>No team members added yet.</p>";
        return;
      }

      snap.forEach((d) => {
        const data = d.data();
        const div = document.createElement('div');
        div.className = 'item-list-row';
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${data.imageUrl}">
            <div>
              <strong>${data.name}</strong><br>
              <small style="color:#666;">${data.role}</small>
            </div>
          </div>
          <div>
            <button class="btn edit-team-btn" style="padding:6px 12px; margin-right:5px;">Edit</button>
            <button class="btn-danger del-team-btn">Delete</button>
          </div>
        `;

        div.querySelector('.edit-team-btn').onclick = () => {
          document.getElementById('teamDocId').value = d.id;
          document.getElementById('teamName').value = data.name;
          document.getElementById('teamRole').value = data.role;
          document.getElementById('teamExistingUrl').value = data.imageUrl;
          document.getElementById('teamFormTitle').innerText = "Edit Team Member";
          document.getElementById('teamSubmitBtn').innerText = "Update Member";
          document.getElementById('teamCancelBtn').classList.remove('hidden');
        };

        div.querySelector('.del-team-btn').onclick = async () => {
          if (confirm("Delete this team member?")) {
            await deleteDoc(doc(db, "team", d.id));
            loadTeam();
          }
        };

        list.appendChild(div);
      });
    } catch (err) {
      list.innerHTML = "<p>Error: " + err.message + "</p>";
    }
  }

  function resetTeamForm() {
    document.getElementById('teamDocId').value = "";
    document.getElementById('teamExistingUrl').value = "";
    teamForm.reset();
    document.getElementById('teamFormTitle').innerText = "Add Leadership Team Member";
    document.getElementById('teamSubmitBtn').innerText = "Save Member";
    document.getElementById('teamCancelBtn').classList.add('hidden');
  }
  document.getElementById('teamCancelBtn').onclick = resetTeamForm;
</script>
</body>
</html>
